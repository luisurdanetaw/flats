# The SDKs live beside the engine: `sdk/c` is the C ABI every language binding
# wraps, `sdk/node` the Node.js addon over it. Plain `cargo test` at the root
# still builds and tests only the engine (`flats`); pass `--workspace` for all.
[workspace]
members = [".", "sdk/c", "sdk/node"]
default-members = ["."]

[package]
name = "flats"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
memmap2 = "0.9"
# WAL checksum + record (de)serialization. Pulled in deliberately for now;
# slated to be replaced with hand-rolled impls once new devs onboard (see
# CLAUDE.md §2 — these are the sanctioned temporary exceptions to zero-dep).
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
roaring = "0.11.4"

[features]
# Exposes the engine's internal modules (wal, index, metadata, vm, …) as
# `#[doc(hidden)]` public paths. NOT part of the supported API and exempt from
# semver: it exists so the test suite and benches can reach the layers they
# exercise directly. Library users should never need it.
internals = []

[dev-dependencies]
# The crate's own tests and benches see the internals (see `internals` above).
flats = { path = ".", features = ["internals"] }
tempfile = "3"
# Compile-time trait assertions (header-only, no proc-macros, test-only). Used to
# pin `Writer: !Clone`, the type-level half of the single-writer invariant.
static_assertions = "1"

# Custom bench harnesses — no `criterion` dep (see CLAUDE.md §2, §11).
[[bench]]
name = "simd"
harness = false

[[bench]]
name = "parallel_search"
harness = false
