name: CI

# Build, test, and bench every pull request (and pushes to main).
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't queue duplicates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Style gates ───────────────────────────────────────────────────────────
  # Blocking: a fmt diff or any clippy warning fails the run. Clippy covers
  # x86_64 here; the NEON path is cfg-gated, so the aarch64 job clippies it.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The run above builds the library WITH `internals` (the test suite's
      # self dev-dependency turns it on). A downstream crate sees the default
      # build, where the modules are private and `missing_docs` is on — lint
      # and document THAT one too.
      - name: clippy (default features, as a dependent sees it)
        run: cargo clippy --lib --locked -- -D warnings
      - name: rustdoc (public API)
        run: cargo doc --no-deps --lib --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Build → test → bench (the blocking pipeline) ───────────────────────────
  build-test-bench:
    name: build · test · bench
    runs-on: ubuntu-latest
    # chaos harness (~45s) + timed SWMR loops + release-mode benches. 25m is
    # generous headroom; bump if the chaos iteration count grows.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version && cargo --version

      # Caches ~/.cargo and ./target keyed on Cargo.lock — big speedup on reruns.
      # Purely a convenience; remove this step if you'd rather stay action-free.
      - uses: Swatinem/rust-cache@v2

      # 1. BUILD — compile the lib and *every* target (tests, benches) up front,
      #    so a compile break surfaces before we spend time running anything.
      #    --locked fails if Cargo.lock is stale (reproducible deps).
      - name: Build (all targets)
        run: cargo build --all-targets --locked

      # 2. TEST — unit tests + all integration suites, auto-discovered from
      #    tests/: chaos, reconciliation, swmr, index, simd_parity. Debug profile
      #    (keeps debug_assert! live). Doctests run separately: --all-targets
      #    deliberately excludes them, so cover them explicitly below.
      - name: Test
        run: cargo test --locked
      - name: Doc tests
        run: cargo test --doc --locked

      # 3. BENCH — run the custom (harness = false) benches: simd + parallel_search.
      #    On shared CI runners the throughput NUMBERS are noise; this is a smoke
      #    run that proves the kernels + parallel search compile in release and
      #    execute without panicking. Not a performance gate.
      - name: Benches (smoke run)
        run: cargo bench --locked

  # ── aarch64: native ARM runner ─────────────────────────────────────────────
  # Runs the suite where `simd::neon` is the dispatched kernel, so simd_parity
  # actually exercises NEON against scalar (x86 never compiles that module).
  # Also clippies it, since the x86 lint job cannot see aarch64-only code.
  # No bench smoke run: build-test-bench already covers that on x86.
  test-aarch64:
    name: build · test (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The arm64 runner image is younger than the x86 one; bootstrap rustup
      # in case it is missing rather than depend on what the image ships.
      - name: Install stable toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build (all targets)
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Doc tests
        run: cargo test --doc --locked
